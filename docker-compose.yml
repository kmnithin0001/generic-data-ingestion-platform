version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: ingestion-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "4080"
      MYSQL_DATABASE: "ingestion_db"
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - ingestion-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1536M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p4080"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ingestion-app
    ports:
      - "8080:8080"
    environment:
      DB_URL: "jdbc:mysql://mysql:3306/ingestion_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      DB_USER: "root"
      DB_PASSWORD: "4080"
      JAVA_OPTS: "-XX:+UseG1GC -XX:MaxRAMPercentage=75 -Dspring.profiles.active=prod"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ingestion-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: ingestion-prometheus
    volumes:
      - ./.prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - ingestion-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: ingestion-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - ingestion-network
    restart: unless-stopped

volumes:
  mysql-data:
  prometheus-data:
  grafana-data:

networks:
  ingestion-network:
    driver: bridge
