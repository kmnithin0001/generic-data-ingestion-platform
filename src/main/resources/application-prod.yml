spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ingestion_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  async:
    corePoolSize: 10
    maxPoolSize: 20
    queueCapacity: 1000
    threadNamePrefix: "ingestion-async-prod-executor-"
    rejectionPolicy: "CallerRunsPolicy"
  ingestion:
    progress-interval: 5
