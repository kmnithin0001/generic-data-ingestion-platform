spring:
  application:
    name: generic-data-ingestion-platform
  
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:ingestion}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          batch_size: 20
          batch_versioned_data: true
        order_inserts: true
        order_updates: true
        show_sql: false
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    connect-retries: 10

resilience4j:
  retry:
    instances:
      ingestionEngine:
        maxAttempts: 3
        waitDuration: 100ms
        retryExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - java.lang.IllegalStateException
          - org.springframework.web.reactive.function.client.WebClientRequestException
  
  circuitbreaker:
    instances:
      ingestionEngine:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 1000ms
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  async:
    corePoolSize: 4
    maxPoolSize: 8
    queueCapacity: 50
    threadNamePrefix: "ingestion-async-executor-"
    rejectionPolicy: "CallerRunsPolicy"
  ingestion:
    progress-interval: 1
